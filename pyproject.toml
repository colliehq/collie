[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "collie-harness"
# single source of truth: harness/__init__.py __version__ (read via [tool.setuptools.dynamic] below).
# the installer reads the same value at build time (iscc /DAppVer=...), so a version lives in one place.
dynamic = ["version"]
description = "A personal AI operations system for durable missions across models, tools, apps, and devices."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Daming Wu" }]
dependencies = []                       # core is stdlib-only

[project.urls]
Homepage = "https://collie.run"
Documentation = "https://colliehq.github.io/collie/"
Repository = "https://github.com/colliehq/collie"
Issues = "https://github.com/colliehq/collie/issues"

[project.optional-dependencies]
# semantic memory: granite / bge-m3 / e5 + the bge reranker, all run via onnxruntime (no torch).
# `collie setup` installs this; without it memory degrades to BM25 keyword recall (never to hash).
local = ["onnxruntime", "tokenizers", "huggingface-hub", "numpy"]
fastembed = ["fastembed"]               # opt-in: jina-v3 / other fastembed models (jina is CC-BY-NC)
browser = ["playwright"]
claude = ["claude-agent-sdk>=0.2.136,<0.3"] # official Claude-plan runtime for overnight Missions
remote = ["cryptography"]               # Collie Remote E2E. QR codes need nothing: harness/qr.py is stdlib
desktop = ["pyobjc-framework-Cocoa; sys_platform == 'darwin'",     # the real behind-the-icons
           "pyobjc-framework-WebKit; sys_platform == 'darwin'",     # desktop on macOS (window
           "pyobjc-framework-Quartz; sys_platform == 'darwin'"]     # levels + WKWebView, no Xcode)
tui = ["rich"]                          # the full-experience terminal chat (collie tui)
acp = ["agent-client-protocol"]         # editor integration (collie acp)
search = ["ddgs"]                        # keyless web_search (DuckDuckGo JSON API)
dev = ["pytest", "pyyaml"]
docs = ["mkdocs-material"]               # the user docs site (mkdocs serve / build); see mkdocs.yml

[project.scripts]
collie = "harness.cli:main"             # `collie -p "task"` one-liner

[tool.setuptools]
# These three data-only directories are explicit packages so setuptools never has to guess whether
# their shipped HTML/JS/native assets are accidental namespace packages.
packages = ["harness", "harness.browser_ext", "harness.wallpaper", "harness.webui"]

[tool.setuptools.dynamic]
version = { attr = "harness.__version__" }

# ship the web GUI + browser extension inside the wheel — without this, `pip install collie-harness`
# produced a package whose `collie web` 404s on its own index.html (assets only existed in the repo).
[tool.setuptools.package-data]
# ship the web GUI, the browser extension, AND the desktop wallpaper engine (C# source + WebView2
# DLLs + build/stop scripts) so `pip install collie-harness` gives `collie wallpaper` everything it
# needs — it builds the .exe on first use via the in-box csc (no .NET SDK). Windows-only feature.
harness = ["webui/*.html", "webui/*.js", "webui/*.svg", "webui/*.png",
           # Keep this list explicit: browser_ext/token.txt is per-device authentication state and
           # must never enter a wheel/installer merely because a maintainer built from a live tree.
           "browser_ext/*.html", "browser_ext/*.js", "browser_ext/*.json", "browser_ext/*.png",
           "wallpaper/*.cs", "wallpaper/*.dll", "wallpaper/*.ps1", "wallpaper/*.md", "wallpaper/*.ico"]

[tool.setuptools.exclude-package-data]
# Defence in depth if a future package-data pattern is broadened again. auth.js is the legacy
# generated credential shim seen in older live installs; it is not a source asset either.
harness = ["browser_ext/token.txt", "browser_ext/auth.js", "browser_ext/*.txt"]
