name: Platform diagnostic
on:
  push:
    branches: [diagnostic/0.27.0-platforms]
permissions:
  contents: read
jobs:
  mac:
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      COLLIE_PROVIDER: mock
      COLLIE_EMBED: bm25
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install -e '.[browser,tui,acp,search,remote,dev,claude,codex]'
      - run: python -m playwright install chromium
      - run: python tests/test_qr.py
      - run: python tests/bridge_platform_probe.py
      - run: |
          for attempt in 1 2 3; do
            python -m pytest -q -s tests/test_tools.py::test_execute_code_reaps_descendants_after_normal_exit_and_exception || true
          done
      - run: python -m pytest -q tests/surfaces_test.py::test_browser_bridge_health tests/test_tools.py::test_execute_code_reaps_descendants_after_normal_exit_and_exception tests/test_web_mobile_capability_sync.py tests/test_web_task_inbox.py::test_deleting_a_conversation_withdraws_an_undelivered_claim
