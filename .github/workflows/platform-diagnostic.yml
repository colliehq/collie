name: Platform diagnostic
on:
  push:
    branches: [diagnostic/0.27.0-platforms]
permissions:
  contents: read
jobs:
  mac:
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      COLLIE_PROVIDER: mock
      COLLIE_EMBED: bm25
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install -e '.[browser,tui,acp,search,remote,dev,claude,codex]'
      - run: |
          export COLLIE_STATE_DIR="$(mktemp -d)"
          export COLLIE_MCP_CONFIG="$COLLIE_STATE_DIR/mcp.json"
          printf '{"mcpServers":{}}' > "$COLLIE_MCP_CONFIG"
          python -m pytest -q tests/test_loop.py
          python tests/test_loop.py
