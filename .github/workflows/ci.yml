name: CI

# Gate every push to main and every PR on the same suite that guards local pushes
# (tests/run_all.sh): py_compile · core · renderer (Node) · GUI (Playwright) · surfaces.
# Runs on Linux, macOS AND Windows so cross-platform support is proven every commit, not asserted.
# Everything runs offline against the mock provider, no API keys, no secrets. Memory runs BM25-only
# (COLLIE_EMBED=bm25) — the real no-[local] degradation path, not the removed hash embedder.

on:
  push:
    branches: [main]
  pull_request:

# a newer push to the same branch/PR cancels the in-flight run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false          # one OS failing must not hide the status of the others
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        # bash on every OS — Git Bash is preinstalled on the windows runner, so run_all.sh and
        # the POSIX-shell bash-tool tests execute for real on Windows (plat.posix_shell finds it),
        # rather than degrading to cmd.exe or skipping.
        shell: bash
    env:
      COLLIE_PROVIDER: mock          # offline, deterministic — no vendor calls
      COLLIE_EMBED: bm25             # BM25-only: the real fallback when [local] isn't installed
                                     # (the hash embedder was removed — measured worse than BM25)
      PYTHONUNBUFFERED: "1"
      HF_HUB_DISABLE_SYMLINKS_WARNING: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Install Collie + test extras
        # core is stdlib-only; extras cover the surfaces the suite exercises
        #   browser=playwright (GUI) · tui=rich · acp=agent-client-protocol · search=ddgs · dev=pytest
        # (fastembed/`local` is intentionally omitted — tests exercise the BM25 fallback)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[browser,tui,acp,search,remote,dev]"

      - name: Install Playwright Chromium
        # --with-deps installs the OS libraries chromium needs, but that flag is Linux-only;
        # macOS/Windows ship them, so plain `install` there.
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            python -m playwright install --with-deps chromium
          else
            python -m playwright install chromium
          fi

      - name: Run test suite
        run: bash tests/run_all.sh
