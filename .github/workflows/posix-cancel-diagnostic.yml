name: POSIX cancellation diagnostic
on:
  push:
    branches: [diagnostic/eight-posix-cancel-20260922]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        variant: [baseline, reap-exited-first]
    env:
      COLLIE_PROVIDER: mock
      COLLIE_EMBED: bm25
      PYTHONUNBUFFERED: '1'
      DIAGNOSTIC_VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install focused test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Record kernel and run controlled cancellation cases
        run: python bench/diagnostics/posix_cancel_probe.py
