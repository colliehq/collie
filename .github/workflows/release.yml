name: Release

# Cut a release by pushing a version tag that matches harness/__init__.py:
#   git tag v0.19.0 && git push origin v0.19.0
# Produces a GitHub Release with the Windows one-click installer (Collie-Setup.exe) and the Python
# wheel + sdist attached. No PyPI publish (yet) and no secrets — GITHUB_TOKEN is enough to create the
# release. When you're ready for PyPI, add a publish job using Trusted Publishing (OIDC, no token).

on:
  push:
    tags: ["v*"]

permissions:
  contents: write        # create the GitHub Release and upload assets

jobs:
  # The tag and the in-code version must agree, or downstream users get a v0.19.0 release that
  # installs 0.18.0. Fail loudly before building anything.
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Tag matches harness.__version__
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CODE=$(python -c "import harness; print(harness.__version__)")
          echo "tag=$TAG  code=$CODE"
          test "$TAG" = "$CODE" || { echo "::error::tag v$TAG != harness.__version__ $CODE"; exit 1; }

  wheel:
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build
      - run: python -m build                       # dist/*.whl + dist/*.tar.gz (version is dynamic)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-dist
          path: dist/*

  installer:
    needs: check-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Inno Setup 6
        run: choco install innosetup --no-progress -y
      - name: Generator deps (Pillow for the wizard art)
        run: python -m pip install --upgrade pillow
      - name: Build Collie-Setup.exe (WebView2 shell wrapping the Inno backend)
        # pack.ps1 runs build.ps1 (art -> language data -> embeddable-python payload -> iscc) to make the
        # silent Inno backend, then wraps the WebView2 "smart shell" (the dark app-grade UI) around it
        # into one self-extracting Collie-Setup.exe. Without this the release shipped the raw Inno wizard
        # and users never saw the shell. csc is the in-box .NET Framework compiler (no SDK needed); the
        # WebView2 DLLs are committed under harness/wallpaper.
        shell: pwsh
        run: ./installer/shell/pack.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-installer
          path: installer/Output/Collie-Setup.exe

  release:
    needs: [wheel, installer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: Collie ${{ github.ref_name }}
          generate_release_notes: true            # auto-changelog from merged PRs since the last tag
          files: |
            artifacts/windows-installer/Collie-Setup.exe
            artifacts/python-dist/*
