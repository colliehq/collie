name: Release

# Cut a release by pushing a version tag that matches harness/__init__.py:
#   git tag v0.19.0 && git push origin v0.19.0
# Produces a GitHub Release with the Windows one-click installer (Collie-Setup.exe), both macOS disk
# images (arm64 + x86_64) and the Python wheel + sdist attached.
#
# The macOS job signs and notarises only if these repository secrets are set; without them it still
# builds, and says plainly that the result is not shippable:
#   MACOS_CERT_P12       base64 of a Developer ID Application .p12  (see installer/DEVELOPER_ID.md)
#   MACOS_CERT_PASSWORD  the password used when exporting that .p12
#   ASC_KEY_P8           base64 of the App Store Connect API key (.p8)
#   ASC_KEY_ID           its key id
#   ASC_ISSUER_ID        the issuer UUID
#
# No PyPI publish (yet). GITHUB_TOKEN is enough to create the release; when you're ready for PyPI,
# add a publish job using Trusted Publishing (OIDC, no token).

on:
  push:
    tags: ["v*"]
  # Manual dry run. The signing chain has a lot of ways to look fine and not be — an unsigned dmg
  # notarises and staples happily, and a secret that is set but unreadable makes the build fall back
  # to unsigned in silence. Being able to exercise it WITHOUT cutting a release is what lets you find
  # that out before a release depends on it. Nothing is published on this path.
  workflow_dispatch:

permissions:
  contents: write        # create the GitHub Release and upload assets

jobs:
  # The tag and the in-code version must agree, or downstream users get a v0.19.0 release that
  # installs 0.18.0. Fail loudly before building anything.
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Tag matches harness.__version__
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CODE=$(python -c "import harness; print(harness.__version__)")
          echo "tag=$TAG  code=$CODE"
          test "$TAG" = "$CODE" || { echo "::error::tag v$TAG != harness.__version__ $CODE"; exit 1; }

  wheel:
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build
      - run: python -m build                       # dist/*.whl + dist/*.tar.gz (version is dynamic)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-dist
          path: dist/*

  installer:
    needs: check-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Inno Setup 6
        run: choco install innosetup --no-progress -y
      - name: Generator deps (Pillow for the wizard art)
        run: python -m pip install --upgrade pillow
      - name: Build Collie-Setup.exe (WebView2 shell wrapping the Inno backend)
        # pack.ps1 runs build.ps1 (art -> language data -> embeddable-python payload -> iscc) to make the
        # silent Inno backend, then wraps the WebView2 "smart shell" (the dark app-grade UI) around it
        # into one self-extracting Collie-Setup.exe. Without this the release shipped the raw Inno wizard
        # and users never saw the shell. csc is the in-box .NET Framework compiler (no SDK needed); the
        # WebView2 DLLs are committed under harness/wallpaper.
        shell: pwsh
        run: ./installer/shell/pack.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-installer
          path: installer/Output/Collie-Setup.exe


  # macOS: the counterpart of the `installer` job. Two runners because python-build-standalone ships
  # per-arch builds and no universal2 — macos-14 is Apple Silicon, macos-13 is Intel — so a complete
  # release is two disk images, not one fat app.
  #
  # Signing is conditional, not assumed. Without the secrets this still produces an ad-hoc dmg (useful
  # for testing the build itself), and build_mac.sh refuses to pretend it is shippable: it asks
  # Gatekeeper for a verdict and exits non-zero if a notarised build is still refused.
  dmg:
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-13
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    # A step's own `env:` block is NOT in scope for that step's `if:`, so testing the secret there
    # would evaluate to false forever and the build would quietly ship unsigned. Job-level env can
    # read `secrets`, and step-level `if` can read job-level env.
    env:
      HAVE_CERT: ${{ secrets.MACOS_CERT_P12 != '' }}
      HAVE_ASC: ${{ secrets.ASC_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: A real app icon
        run: brew install librsvg          # the build falls back to Chrome, but this is faster

      # The certificate lives in a throwaway keychain, not the login one: a runner has no login
      # keychain to speak of, and a dedicated one is deleted with the VM either way.
      - name: Import the Developer ID certificate
        if: env.HAVE_CERT == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          PASS="$(uuidgen)"
          security create-keychain -p "$PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$PASS" "$KEYCHAIN"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" \
                          -T /usr/bin/codesign -T /usr/bin/security
          # without this every codesign call blocks on a GUI prompt no one can answer
          security set-key-partition-list -S apple-tool:,apple: -k "$PASS" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning | grep "Developer ID Application"

      - name: Notarisation credentials
        if: env.HAVE_ASC == 'true'
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          echo "$ASC_KEY_P8" | base64 --decode > "$RUNNER_TEMP/asc.p8"
          xcrun notarytool store-credentials collie --key "$RUNNER_TEMP/asc.p8" \
                --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID"
          rm -f "$RUNNER_TEMP/asc.p8"

      - name: Build Collie-${{ matrix.arch }}.dmg
        run: |
          args=(--bundle-python --dmg --arch "${{ matrix.arch }}")
          [ "$HAVE_CERT" = "true" ] && args+=(--sign)
          [ "$HAVE_ASC" = "true" ] && args+=(--notarize collie)
          bash installer/build_mac.sh "${args[@]}"
          mv installer/Output/Collie-*.dmg "installer/Output/Collie-${{ matrix.arch }}.dmg"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-dmg-${{ matrix.arch }}
          path: installer/Output/Collie-${{ matrix.arch }}.dmg

  release:
    needs: [wheel, installer, dmg]
    if: startsWith(github.ref, 'refs/tags/v')     # a manual dispatch builds and verifies, and stops there
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: Collie ${{ github.ref_name }}
          generate_release_notes: true            # auto-changelog from merged PRs since the last tag
          files: |
            artifacts/windows-installer/Collie-Setup.exe
            artifacts/macos-dmg-arm64/*.dmg
            artifacts/macos-dmg-x86_64/*.dmg
            artifacts/python-dist/*
