name = "collie"
compatibility_date = "2026-08-09"
pages_build_output_dir = "dist"

# Workers AI — powers /api/chat ("Ask Collie").
[ai]
binding = "AI"

# Atomic per-IP/day counter. Deploy landing/rate-limiter-worker first; Pages binds to it by name.
[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "ChatRateLimiter"
script_name = "collie-chat-rate-limiter"
