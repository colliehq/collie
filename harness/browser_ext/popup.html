<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg:#FBFCFE; --panel:#F2F4F8; --ink:#1A1F2B; --muted:#5E6473; --faint:#8A90A0;
    --line:#DDE1E9; --accent:#3D4E8F; --ok:#3E8E6E; --ok-bg:#E1F0E9; --bad:#CD4234; --bad-bg:#FBE7E3;
    --warn:#B4720C; --warn-bg:#FBF0DC;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14161D; --panel:#1C2029; --ink:#E7E9F0; --muted:#969CAD; --faint:#666C7C;
            --line:#2A2F3A; --accent:#8FA0E0; --ok:#5FBF95; --ok-bg:#1B3A2E; --bad:#E58074;
            --bad-bg:#3A211D; --warn:#D9A441; --warn-bg:#3A2E18; }
  }
  * { box-sizing:border-box; }
  body { width:300px; margin:0; background:var(--bg); color:var(--ink); font-size:13px;
    font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
  .head { display:flex; align-items:center; gap:9px; padding:14px 15px 11px; }
  .head img { width:26px; height:26px; }
  .title { font-weight:640; font-size:14px; letter-spacing:-.01em; }
  .ver { margin-left:auto; font-size:11px; color:var(--faint);
    font-family:ui-monospace,Consolas,monospace; }
  .status { display:flex; align-items:center; gap:9px; margin:0 12px 12px; padding:12px 13px;
    border-radius:11px; background:var(--panel); border:1px solid var(--line); }
  .dot { width:9px; height:9px; border-radius:50%; flex:none; background:var(--faint); }
  .dot.ok { background:var(--ok); box-shadow:0 0 0 3px var(--ok-bg); }
  .dot.bad { background:var(--bad); box-shadow:0 0 0 3px var(--bad-bg); }
  .dot.warn { background:var(--warn); box-shadow:0 0 0 3px var(--warn-bg); }
  .stext { line-height:1.35; }
  .stext b { display:block; font-weight:620; }
  .stext span { color:var(--muted); font-size:11.5px; }
  .rows { margin:0 12px; border-top:1px solid var(--line); }
  .row { display:flex; gap:10px; padding:8px 1px; font-size:12px; border-bottom:1px solid var(--line); }
  .row:last-child { border-bottom:none; }
  .row .k { color:var(--faint); width:78px; flex:none; }
  .row .v { color:var(--ink); word-break:break-all;
    font-family:ui-monospace,Consolas,monospace; font-size:11.5px; }
  .acts { display:flex; gap:8px; padding:12px; }
  button { flex:1; padding:8px 10px; border-radius:9px; border:1px solid var(--line);
    background:var(--panel); color:var(--ink); font:inherit; font-size:12.5px; cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  button:hover { filter:brightness(1.05); }
  button:active { transform:translateY(1px); }
  .toggle { display:flex; align-items:flex-start; gap:10px; margin:11px 12px 0; padding:11px 13px;
    border-radius:11px; background:var(--panel); border:1px solid var(--line); cursor:pointer; }
  .toggle input { margin:2px 0 0; width:15px; height:15px; accent-color:var(--accent); flex:none; cursor:pointer; }
  .toggle .tg-text { line-height:1.35; }
  .toggle .tg-text b { display:block; font-weight:620; font-size:12.5px; }
  .toggle .tg-text span { color:var(--muted); font-size:11px; }
  .site { margin:9px 12px 0; }
  .site-h { font-size:11px; color:var(--faint); margin:0 2px 6px;
    font-family:ui-monospace,Consolas,monospace; word-break:break-all; }
  .seg { display:flex; gap:6px; }
  .seg button { flex:1; padding:6px 3px; font-size:11px; border-radius:8px; border:1px solid var(--line);
    background:var(--panel); color:var(--muted); cursor:pointer; }
  .seg button.on { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  .hint { padding:0 15px 13px; font-size:11.5px; color:var(--muted); line-height:1.45; }
  .hint code { font-family:ui-monospace,Consolas,monospace; background:var(--panel);
    padding:1px 4px; border-radius:4px; }
</style>
</head>
<body>
  <div class="head">
    <img src="icon48.png" alt="">
    <div class="title">collie bridge</div>
    <div class="ver" id="ver">—</div>
  </div>

  <div class="status">
    <div class="dot" id="dot"></div>
    <div class="stext"><b id="sTitle">Checking…</b><span id="sSub">contacting the local bridge</span></div>
  </div>

  <div class="rows">
    <div class="row"><div class="k">Bridge</div><div class="v" id="rBridge">127.0.0.1:8677</div></div>
    <div class="row"><div class="k">Last poll</div><div class="v" id="rPoll">—</div></div>
    <div class="row"><div class="k">Active tab</div><div class="v" id="rTab">—</div></div>
  </div>

  <label class="toggle" for="hiFi">
    <input type="checkbox" id="hiFi">
    <span class="tg-text"><b>High-fidelity input <span style="font-weight:400">(default)</span></b>
      <span>Real clicks via chrome.debugger — for sites that ignore synthetic ones (eBay, banking).
      Shows a debug banner while active.</span></span>
  </label>

  <div class="site">
    <div class="site-h">This site · <span id="siteOrigin">—</span></div>
    <div class="seg" id="siteSeg">
      <button data-scope="default">Default</button>
      <button data-scope="always">Always</button>
      <button data-scope="session">Session</button>
      <button data-scope="off">Off</button>
    </div>
  </div>

  <div class="acts">
    <button class="primary" id="openCollie">Open Collie</button>
    <button id="recheck">Re-check</button>
  </div>

  <div class="hint" id="hint"></div>
  <script src="popup.js"></script>
</body>
</html>
