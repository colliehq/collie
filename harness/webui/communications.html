<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Email & phone · Collie</title>
<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit;color:inherit}button,a,input,select,textarea{touch-action:manipulation}button{cursor:pointer}button:disabled{opacity:.5;cursor:wait}a{color:var(--brand);text-underline-offset:3px}button,.button{border:1px solid var(--line);border-radius:9px;padding:8px 13px;background:var(--panel);text-decoration:none}button.primary{background:var(--brand);color:var(--panel);border-color:var(--brand);font-weight:650}button.quiet{border-color:transparent;background:transparent}button.danger{color:var(--danger)}:focus-visible{outline:3px solid var(--brand);outline-offset:3px}h1,h2,h3,p{margin:0}h1{font-size:25px;letter-spacing:-.5px}h2{font-size:18px}h3{font-size:16px}.muted{color:var(--mut);font-size:13px}.shell{max-width:1280px;margin:auto;padding:24px}header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:24px}.head{display:flex;align-items:center;gap:16px}.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:22px}.sidebar{align-self:start}.sidebar .actions{margin:12px 0}.connections{display:grid;gap:8px}.connection{width:100%;text-align:left;padding:14px;border-radius:12px;overflow-wrap:anywhere}.connection[aria-pressed=true]{background:var(--soft);border-color:var(--brand)}.connection strong,.connection small{display:block}.connection small{color:var(--mut);margin-top:4px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;min-width:0}.toolbar{display:flex;justify-content:space-between;gap:15px;padding:18px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}.tabs{display:flex;gap:5px}.tabs button[aria-selected=true]{background:var(--soft);color:var(--brand);border-color:transparent}.workspace{display:grid;grid-template-columns:minmax(220px,34%) minmax(0,1fr);min-height:520px}.messages{border-right:1px solid var(--line);overflow:auto;max-height:75vh}.message{border:0;border-radius:0;border-bottom:1px solid var(--line);width:100%;padding:16px;text-align:left;background:transparent}.message[aria-pressed=true]{background:var(--soft)}.message strong,.message small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.message small{color:var(--mut);margin-top:5px}.detail{padding:24px;min-width:0}.detail .actions{margin-top:18px}.detail pre{font:inherit;white-space:pre-wrap;overflow-wrap:anywhere;margin:18px 0;max-height:55vh;overflow:auto}.badge{display:inline-block;padding:2px 8px;border-radius:20px;background:var(--soft);color:var(--brand);font-size:12px;margin:8px 0}.empty{padding:52px 26px;text-align:center;max-width:600px;margin:auto}.empty p{color:var(--mut);margin:12px 0 22px}.empty .actions{justify-content:center}.notice{margin-bottom:16px;padding:11px 14px;border-radius:10px;background:var(--soft);overflow-wrap:anywhere}.notice.error{background:var(--panel);color:var(--danger);border:1px solid var(--danger)}[hidden]{display:none!important}dialog{border:1px solid var(--line);border-radius:18px;background:var(--panel);color:var(--ink);padding:0;width:min(560px,calc(100vw - 24px));max-height:90vh;overflow:auto}dialog::backdrop{background:#15211480}dialog form{padding:24px}dialog h2{margin-bottom:6px}dialog .intro{margin-bottom:20px}.field{display:grid;gap:6px;margin:14px 0}.field>span{font-size:13px;font-weight:600}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px 11px;background:var(--bg)}textarea{resize:vertical;min-height:150px}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:12px}.check{display:flex;align-items:flex-start;gap:9px;margin:14px 0;font-size:14px}.check input{width:auto;margin-top:5px}.dialog-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:24px}.files{display:flex;gap:8px;flex-wrap:wrap}.files a{font-size:13px;overflow-wrap:anywhere}.status-line{font-size:12px;color:var(--mut);margin:1 @media(max-width:800px){.shell{padding:16px}.layout{grid-template-columns:1fr}.connections{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}.sidebar .actions{margin:8px 0}.workspace{min-height:420px}.head{gap:10px}header{align-items:flex-start}.header-copy p{max-width:310px}.detail{padding:18px}}
@media(max-width:560px){h1{font-size:22px}.workspace{display:block}.messages{border-right:0;max-height:55vh}.workspace.has-selection .messages{display:none}.workspace:not(.has-selection) .detail{display:none}.mobile-back{display:inline-block;margin-bottom:14px}.twocol{grid-template-columns:1fr}.toolbar{padding:12px}.head>a{padding:7px}.header-copy p{font-size:12px}}

<body>
<div class="shell">
  <header><div class="head"><a class="button" href="/" aria-label="Back to Collie">←</a><div class="header-copy"><h1 data-en="Email & phone" data-zh="邮箱与电话"></h1><p class="muted" data-en="Bring requests in. Keep results within reach." data-zh="接收请求，把结果送到你身边。"></p></div></div><button id="addTop" data-en="Add connection" data-zh="添加连接"></button></header>
  <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
  <div class="layout">
    <aside class="sidebar"><h2 data-en="Your connections" data-zh="我的连接"></h2><p class="status-line" data-en="Optional. Collie works without connecting an account." data-zh="按需连接，不影响桌面直接使用。"></p><div id="connections" class="connections"></div><div class="actions"><button id="refresh" class="quiet" data-en="Refresh" data-zh="刷新"></button></div><p class="muted" data-en="Checks run while Collie is open. Pausing a connection keeps its tasks and messages." data-zh="Collie 运行时自动检查。暂停连接会保留已有任务和消息。"></p></aside>
    <main class="panel"><div id="welcome" class="empty" hidden><h2 data-en="Give Collie a way to reach you" data-zh="为 Collie 接上邮箱或电话"></h2><p data-en="Connect a mailbox to receive requests and prepare reply drafts, or use your Twilio number for SMS and spoken notifications. You choose when to send." data-zh="连接邮箱接收请求、准备回复草稿；也可以连接 Twilio 号码，收发短信或语音通知。发送方式由你决定。"></p><div class="actions"><button id="welcomeMail" class="primary" data-en="Connect email" data-zh="连接邮箱"></button><button id="welcomePhone" data-en="Connect phone" data-zh="连接电话"></button></div></div>
    <section id="mailbox" hidden><div class="toolbar"><div class="tabs" role="tablist"><button id="inboxTab" role="tab" aria-selected="true" data-en="Inbox" data-zh="收件箱"></button><button id="outboxTab" role="tab" aria-selected="false" data-en="Replies & results" data-zh="回复与结果"></button></div><div class="actions"><button id="poll" data-en="Check now" data-zh="立即收取"></button><button id="write" data-en="Write a reply" data-zh="写回复"></button><button id="manage" data-en="Manage" data-zh="管理"></button></div></div><div id="workspace" class="workspace"><div id="messages" class="messages" aria-label="Messages"></div><article id="detail" class="detail"></article></div></section></main>
  </div>
</div>
<dialog id="setup"><form id="setupForm"><h2 id="setupTitle"></h2><p class="intro muted" data-en="Credentials stay on this device and are not passed to the agent." data-zh="连接凭据保存在本机，不会传给 agent。"></p>
<label class="field"><span data-en="Connection type" data-zh="连接方式"></span><select id="kind"><option value="imap">Email · IMAP / SMTP</option><option value="collie_mail">Collie Mail · @collie.run</option><option value="twilio">Phone · Twilio</option></select></label>
<div id="imapFields"><label class="field"><span data-en="Mailbox address" data-zh="邮箱地址"></span><input id="address" type="email" autocomplete="email" placeholder="collie@example.com"></label><div class="twocol"><label class="field"><span>IMAP host</span><input id="imapHost" placeholder="imap.example.com"></label><label class="field"><span>SMTP host</span><input id="smtpHost" placeholder="smtp.example.com"></label></div><div class="twocol"><label class="field"><span data-en="IMAP port" data-zh="IMAP 端口"></span><input id="imapPort" type="number" min="1" max="65535" value="993"></label><label class="field"><span data-en="SMTP encryption" data-zh="SMTP 加密"></span><select id="smtpSecurity"><option value="ssl">TLS · 465</option><option value="starttls">STARTTLS · 587</option></select></label></div><details><summary data-en="Advanced settings" data-zh="高级设置"></summary><label class="field"><span data-en="Login username (defaults to email)" data-zh="登录用户名（默认邮箱地址）"></span><input id="username" autocomplete="username"></label><label class="field"><span data-en="Folder" data-zh="收件文件夹"></span><input id="folder" value="INBOX"></label><label class="field"><span data-en="SMTP port" data-zh="SMTP 端口"></span><input id="smtpPort" type="number" value="465" min="1" max="65535"></label></details><label class="field"><span data-en="App password" data-zh="应用专用密码"></span><input id="password" type="password" autocomplete="new-password"></label><p class="muted" data-en="Use an app password from your email provider. Accounts that require OAuth-only login are not supported by this connection." data-zh="使用邮箱服务商提供的应用专用密码。此连接暂不支持仅允许 OAuth 登录的账户。"></p></div>
<div id="collieFields" hidden><label class="field"><span data-en="Collie Mail address" data-zh="Collie Mail 地址"></span><select id="mailboxName"></select></label><button type="button" id="mailSetup" data-en="Create a Collie Mail address" data-zh="创建 Collie Mail 地址"></button></div>
<div id="phoneFields" hidden><label class="field"><span>Account SID</span><input id="accountSid" autocomplete="off" placeholder="AC…"></label><label class="field"><span>Auth token</span><input id="authToken" type="password" autocomplete="new-password"></label><label class="field"><span data-en="Your Twilio number" data-zh="Twilio 号码"></span><input id="phoneNumber" type="tel" placeholder="+14155550100"></label><p class="muted" data-en="Use a number you already own. SMS and spoken notifications use your Twilio account; provider charges may apply. This does not enable live phone conversations." data-zh="连接已有号码。短信与语音通知使用你的 Twilio 账户，可能产生服务商费用。此处不提供实时电话对话。"></p></div>
<label class="field"><span id="ownerLabel"></span><input id="owner" required autocomplete="off"></label><p class="muted" data-en="Results are sent only to this address or number. Other senders wait for your review." data-zh="结果只发到这个邮箱或号码。其他发件人的请求会等待你查看。"></p>
<label class="field"><span data-en="Project folder (optional)" data-zh="项目文件夹（可选）"></span><input id="project" placeholder=""></label>
<label class="field"><span data-en="First import" data-zh="首次收取"></span><select id="history"><option value="new" data-en="New messages from now (recommended)" data-zh="只收取此后的新消息（推荐）"></option><option value="all" data-en="Import available message history" data-zh="导入可读取的历史消息"></option></select></label><p class="muted" data-en="This choice applies when the connection starts for the first time. Pausing keeps your place." data-zh="此选项用于连接首次启动。暂停后会保留收取进度。"></p>
<label class="check"><input id="autoDraft" type="checkbox"><span data-en="Automatically prepare text-only drafts for my messages" data-zh="自动为我发来的消息准备文字草稿"></span></label><p class="muted" data-en="Drafts cannot use tools or read your project. Up to 10 drafts per hour; attachments wait for review." data-zh="草稿不能调用工具或读取项目。每小时最多 10 条；含附件的来信会等待查看。"></p>
<label class="check"><input id="autoReply" type="checkbox"><span data-en="Automatically send finished replies and task results to me" data-zh="把已完成的回复和任务结果自动发给我"></span></label><p class="muted" data-en="Off by default. Voice calls always require a separate action." data-zh="默认关闭。语音电话始终需要单独发起。"></p>
<label class="check"><input id="enabled" type="checkbox" checked><span data-en="Keep this connection active" data-zh="启用这个连接"></span></label><div id="connectionActions" class="actions" hidden><button type="button" id="probe" data-en="Check connection" data-zh="检查连接"></button><button type="button" id="disconnect" class="danger" data-en="Disconnect account" data-zh="断开账户"></button></div>
<div id="setupError" class="notice error" role="alert" hidden></div><div class="dialog-foot"><button type="button" data-close="setup" data-en="Cancel" data-zh="取消"></button><button id="saveConnection" class="primary" data-en="Save connection" data-zh="保存连接"></button></div></form></dialog>
<dialog id="identity"><form id="identityForm"><h2 data-en="Create a Collie Mail address" data-zh="创建 Collie Mail 地址"></h2><p class="muted" data-en="An email address is optional and separate from your desktop display name." data-zh="邮箱地址按需创建，与你的桌面显示名称无关。"></p><div id="claimFields"><label class="field"><span data-en="Address group (letters, digits and hyphens)" data-zh="地址组名称（字母、数字和连字符）"></span><input id="handle" maxlength="32" autocomplete="off"></label><label class="field"><span data-en="Your verification email" data-zh="接收验证码的邮箱"></span><input id="verifyEmail" type="email" autocomplete="email"></label><button type="button" id="claim" data-en="Send verification code" data-zh="发送验证码"></button><label class="field"><span data-en="Verification code" data-zh="验证码"></span><input id="verifyCode" autocomplete="one-time-code" inputmode="numeric"></label><button type="button" id="verify" data-en="Verify email" data-zh="验证邮箱"></button></div><label class="field"><span data-en="Mailbox prefix" data-zh="邮箱前缀"></span><input id="dogName" value="collie" maxlength="32"></label><p id="addressPreview" class="muted"></p><div id="identityStatus" class="notice" hidden role="status"></div><div class="dialog-foot"><button type="button" data-close="identity" data-en="Close" data-zh="关闭"></button><button id="createMailbox" class="primary" data-en="Create address" data-zh="创建地址"></button></div></form></dialog>
<dialog id="compose"><form id="composeForm"><h2 data-en="Write to yourself" data-zh="给自己发送消息"></h2><p id="recipient" class="muted"></p><label class="field"><span data-en="Message" data-zh="消息内容"></span><textarea id="replyText" required maxlength="60000"></textarea></label><label id="speakLabel" class="check" hidden><input id="speak" type="checkbox"><span data-en="Speak this message in a phone call" data-zh="拨打电话朗读这条消息"></span></label><p id="composeHint" class="muted"></p><div id="composeError" class="notice error" hidden role="alert"></div><div class="dialog-foot"><button type="button" data-close="compose" data-en="Cancel" data-zh="取消"></button><button id="saveReply" class="primary" data-en="Save draft" data-zh="保存草稿"></button></div></form></dialog>
<script>
"use strict";
const $=id=>document.getElementById(id);let lang=(navigator.language||"en").startsWith("zh")?"zh":"en";
let token=(document.querySelector('meta[name="collie-token"]')||{}).content||"",data={connections:[],mail_identity:{}},selected="",tab="events",itemId="",items=[],generation=0,formId="",composeId="",editingDraft=null,composeConnection="",composeEvent="",overviewEpoch=0,connectionStamp="",listStamp="",detailStamp="";
const tr=(en,zh)=>lang==="zh"?zh:en;
function translate(){document.documentElement.lang=lang;document.querySelectorAll("[data-en]").forEach(el=>el.textContent=el.dataset[lang]||el.dataset.en);}
function text(el,value){el.textContent=value==null?"":String(value);return el;}
function node(tag,value,cls){const el=text(document.createElement(tag),value);if(cls)el.className=cls;return el;}
function notice(value,error=false,target="notice"){const el=$(target);text(el,value);el.classList.toggle("error",error);el.hidden=!value;}
function url(path,params={}){const q=new URLSearchParams(params);q.set("token",token);return path+"?"+q.toString();}
async function api(path="/api/channels",body=null,retry=true){const res=await fetch(url(path),body?{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}:{cache:"no-store"});if(res.status===403&&retry){const auth=await fetch("/api/session-token");if(auth.ok){token=(await auth.json()).token;return api(path,body,false);}}const payload=await res.json();if(!res.ok||payload.ok===false)throw new Error(payload.error||tr("Request failed","请求失败"));return payload;}
async function readSection(section,connection){const res=await fetch(url("/api/channels/"+section,{connection}),{cache:"no-store"});const payload=await res.json();if(!res.ok)throw new Error(payload.error||"Request failed");return payload;}
async function action(action,extra={}){const answer=await api("/api/channels",{action,connection:selected,...extra});if(answer.result&&answer.result.ok===false)throw new Error(answer.result.error||tr("Request failed","请求失败"));return answer.result;}
async function busy(button,work,target="notice"){if(button.disabled)return;button.disabled=true;notice("",false,target);try{await work();}catch(e){notice(e.message,true,target);}finally{button.disabled=false;}}
function current(){return data.connections.find(row=>row.id===selected);}
function stateLabel(state){return ({pending:tr("Waiting","待处理"),accepted:tr("Task created","已创建任务"),rejected:tr("Not used","未采用"),sending:tr("Submitting","正在提交"),submitted:tr("Provider accepted","服务商已接收"),failed:tr("Not sent","未发送"),unknown:tr("Check delivery","发送状态待核实"),connected:tr("Connected","已连接"),error:tr("Needs attention","需要检查"),disconnected:tr("Disconnected","已断开"),cancelled:tr("Discarded","已放弃")})[state]||tr("Not checked","尚未检查");}
function renderConnections(){const stamp=JSON.stringify([lang,selected,data.connections]);if(stamp===connectionStamp)return;connectionStamp=stamp;const root=$("connections");root.replaceChildren();for(const row of data.connections){const button=node("button","","connection");button.type="button";button.setAttribute("aria-pressed",String(row.id===selected));button.append(node("strong",row.kind==="twilio"?tr("Phone","电话"):tr("Email","邮箱")),node("small",(row.config||{}).address||(row.config||{}).phone_number||(row.config||{}).mailbox||row.id),node("small",row.enabled===false?tr("Paused","已暂停"):stateLabel(row.status)));button.addEventListener("click",()=>{selected=row.id;itemId="";generation++;renderConnections();loadItems();});root.append(button);}$("welcome").hidden=data.connections.length>0;$("mailbox").hidden=!current();}
async function reload(){const epoch=++overviewEpoch,before=selected,next=await api();if(epoch!==overviewEpoch)return;data=next;if(!data.connections.some(r=>r.id===selected))selected=(data.connections[0]||{}).id||"";if(before!==selected)itemId="";renderConnections();if(current())await loadItems();}
async function loadItems(){const epoch=++generation,connection=selected,section=tab;if(!connection)return;try{const result=await readSection(section,connection);if(epoch!==generation||connection!==selected||section!==tab)return;items=result[section]||[];renderItems();}catch(e){if(epoch===generation)notice(e.message,true);}}
function renderItems(){const stamp=JSON.stringify([lang,selected,tab,itemId,items]);if(stamp===listStamp)return;listStamp=stamp;const list=$("messages");list.replaceChildren();$("inboxTab").setAttribute("aria-selected",String(tab==="events"));$("outboxTab").setAttribute("aria-selected",String(tab==="results"));if(!items.length){list.append(node("div",tab==="events"?tr("No received messages yet. Use Check now to look for new mail or SMS.","还没有来信。点击“立即收取”检查邮件或短信。"):tr("Finished replies and task results will appear here.","完成的回复和任务结果会显示在这里。"),"empty muted"));}for(const item of items){const button=node("button","","message");button.type="button";button.setAttribute("aria-pressed",String(item.id===itemId));button.append(node("strong",item.subject||item.text||tr("Message","消息")),node("small",item.sender||item.destination||""),node("small",stateLabel(item.state)));button.addEventListener("click",()=>{itemId=item.id;renderItems();});list.append(button);}renderDetail();}
function operation(label,handler,primary=false){const b=node("button",label,primary?"primary":"");b.type="button";b.addEventListener("click",()=>busy(b,handler));return b;}
function renderDetail(){const root=$("detail"),item=items.find(i=>i.id===itemId),stamp=JSON.stringify([lang,selected,tab,item]);if(stamp===detailStamp)return;detailStamp=stamp;root.replaceChildren();$("workspace").classList.toggle("has-selection",!!item);if(!item){root.append(node("p",tr("Choose a message to read it.","选择一条消息查看内容。"),"muted"));return;}const back=operation(tr("← Messages","← 消息列表"),()=>{itemId="";renderItems();});back.className="mobile-back";root.append(back,node("h2",item.subject||tr("Message","消息")),node("p",item.sender||item.destination||"","muted"),node("span",stateLabel(item.state),"badge"),node("pre",item.text||""));const problem=(item.metadata||{}).input_error||(item.rejection||{}).reason||(item.outcome||{}).error;if(problem)root.append(node("p",problem,"notice error"));const files=node("div","","files");for(const attachment of item.attachment_refs||[]){const a=node("a",attachment.name||tr("Attachment","附件"));a.href=url("/api/channels/attachment",{connection:selected,digest:attachment.digest});a.download=attachment.name||"attachment";files.append(a);}root.append(files);const actions=node("div","","actions"),connection=selected;
if(tab==="events"&&item.state==="pending"){actions.append(operation(tr("Prepare draft","准备草稿"),async()=>{await action("draft",{connection,event:item.id});notice(tr("Task created. The draft will appear in Replies & results.","已创建任务，完成后会出现在“回复与结果”。"));await loadItems();},true),operation(tr("Run as project task","作为项目任务执行"),async()=>{if(!confirm(tr("Let Collie use the selected project and its tools to handle this request?", "允许 Collie 使用所选项目和工具处理这条请求？")))return;await action("task",{connection,event:item.id});await loadItems();}),operation(tr("Dismiss","忽略"),async()=>{await action("reject",{connection,event:item.id});await loadItems();}));}
const session=(item.acceptance||{}).session||item.session;if(session){const a=node("a",tr("Open task","打开任务"),"button");a.href="/?session="+encodeURIComponent(session);actions.append(a);}
if(tab==="events"&&item.state==="accepted"&&!item.settlement)actions.append(operation(tr("Write reviewed reply","撰写已审阅的回复"),()=>openCompose(null,item)));
if(tab==="results"){if(item.state==="pending"||item.state==="failed")actions.append(operation(tr("Edit draft","编辑草稿"),()=>openCompose(item)));if(item.state==="pending"||item.state==="failed")actions.append(operation(tr("Discard draft","放弃草稿"),async()=>{await action("discard",{connection,id:item.id,digest:item.digest});await loadItems();}));if(item.state==="pending"&&current().enabled!==false)actions.append(operation((item.metadata||{}).speak?tr("Place voice call","拨打语音电话"):tr("Send now","立即发送"),async()=>{if((item.metadata||{}).speak&&!confirm(tr("Call your configured number and read this message aloud?","拨打已配置的号码，朗读这条消息？")))return;await action("send",{connection,id:item.id});await loadItems();},true));if(item.state==="failed")actions.append(operation(tr("Allow retry","重新准备发送"),async()=>{await action("retry",{connection,id:item.id});await loadItems();}));if(item.state==="submitted")root.append(node("p",tr("The provider accepted this request. This alone does not confirm delivery or that a call was answered.","服务商已接收请求。这不代表对方已收到消息或已接听电话。"),"muted"));if(item.state==="unknown"){root.append(node("p",tr("Check the provider's sent folder or logs before retrying. Collie will not resend automatically.","请先查看服务商的已发送记录。Collie 不会自动重发。"),"muted"));for(const [outcome,en,zh] of [["submitted","I confirmed it was sent","我确认已经发送"],["failed","I confirmed it was not sent","我确认没有发送"]])actions.append(operation(tr(en,zh),async()=>{const reason=prompt(tr("What did you check? Record the evidence briefly.","你核对了哪条记录？请简要填写依据。"));if(!reason)return;await action("resolve",{connection,id:item.id,outcome,reason});await loadItems();}));}if((current().kind==="twilio"&&(item.outcome||{}).provider_message_id)||(current().kind==="collie_mail"&&["unknown","submitted"].includes(item.state)))actions.append(operation(tr("Check provider status","查询服务商状态"),async()=>{const r=await action("provider_status",{connection,id:item.id});notice(tr("Provider status: ","服务商状态：")+(r.status||r.state));await loadItems();}));}root.append(actions);}
function fillMailboxes(){const list=$("mailboxName");list.replaceChildren();for(const row of data.mail_identity.mailboxes||[]){const option=node("option",row.address);option.value=row.name;list.append(option);}if(!list.options.length){const option=node("option",tr("Create an address first","请先创建地址"));option.value="";list.append(option);}}
function showKind(){const kind=$("kind").value;$("imapFields").hidden=kind!=="imap";$("phoneFields").hidden=kind!=="twilio";$("collieFields").hidden=kind!=="collie_mail";text($("ownerLabel"),kind==="twilio"?tr("My number for results","接收结果的我的号码"):tr("My email for results","接收结果的我的邮箱"));$("owner").type=kind==="twilio"?"tel":"email";}
function openSetup(kind="imap",row=null){$("setupForm").reset();formId=row?row.id:"channel-"+crypto.randomUUID().slice(0,16);$("kind").value=row?row.kind:kind;$("kind").disabled=!!row;const cfg=row?row.config||{}:{};for(const [id,key,def]of [["address","address",""],["imapHost","imap_host",""],["smtpHost","smtp_host",""],["imapPort","imap_port",993],["smtpPort","smtp_port",465],["smtpSecurity","smtp_security","ssl"],["username","username",""],["folder","folder","INBOX"],["accountSid","account_sid",""],["phoneNumber","phone_number",""]])$(id).value=cfg[key]||def;fillMailboxes();if(cfg.mailbox)$("mailboxName").value=cfg.mailbox;$("owner").value=row?row.owner||"":"";$("project").value=row?row.workspace||"":"";$("history").value=row?row.history||"all":"new";$("history").disabled=!!row;$("autoDraft").checked=!!row&&row.mode==="draft";$("autoReply").checked=!!row&&row.auto_reply;text($("setupTitle"),row?tr("Connection settings","连接设置"):tr("Add a connection","添加连接"));$("password").placeholder=$("authToken").placeholder=row&&row.has_credentials?tr("Leave empty to keep saved credentials","留空以保留已有凭据"):"";$("enabled").checked=!row||row.enabled!==false;$("connectionActions").hidden=!row;notice("",false,"setupError");showKind();$("setup").showModal();}
$("kind").addEventListener("change",showKind);$("smtpSecurity").addEventListener("change",()=>{$("smtpPort").value=$("smtpSecurity").value==="ssl"?465:587;});
$("setupForm").addEventListener("submit",event=>{event.preventDefault();busy($("saveConnection"),async()=>{const kind=$("kind").value;let config,credentials;if(kind==="imap"){config={address:$("address").value.trim(),imap_host:$("imapHost").value.trim(),smtp_host:$("smtpHost").value.trim(),imap_port:Number($("imapPort").value),smtp_port:Number($("smtpPort").value),smtp_security:$("smtpSecurity").value,username:$("username").value.trim(),folder:$("folder").value.trim()};if($("password").value)credentials={password:$("password").value};}else if(kind==="twilio"){config={account_sid:$("accountSid").value.trim(),phone_number:$("phoneNumber").value.trim()};if($("authToken").value)credentials={auth_token:$("authToken").value};}else config={mailbox:$("mailboxName").value};await action("configure",{connection:formId,kind,config,credentials,owner:$("owner").value.trim(),workspace:$("project").value.trim(),mode:$("autoDraft").checked?"draft":"manual",auto_reply:$("autoReply").checked,enabled:$("enabled").checked,history:$("history").value});selected=formId;$("password").value=$("authToken").value="";$("setup").close();notice(tr("Saved. Use Manage → Check connection to verify account access.","已保存。可在“管理”中检查连接。"));await reload();},"setupError");});
$("manage").addEventListener("click",()=>{const row=current();if(!row)return;openSetup(row.kind,row);});
$("probe").addEventListener("click",()=>busy($("probe"),async()=>{await action("probe",{connection:formId});notice(tr("Account access checked. No message was sent.","账户连接已检查，没有发送消息。"),false,"setupError");},"setupError"));
$("disconnect").addEventListener("click",()=>busy($("disconnect"),async()=>{if(!confirm(current()?.kind==="collie_mail"?tr("Pause this connection? Your mail identity, tasks and messages will be kept.","暂停这个连接？邮箱身份、任务和消息会保留。"):tr("Remove saved credentials and pause this connection? Tasks and messages will be kept.","移除保存的凭据并暂停连接？任务和消息会保留。")))return;await action("disconnect",{connection:formId});$("password").value=$("authToken").value="";$("setup").close();await reload();},"setupError"));
$("addTop").addEventListener("click",()=>openSetup());$("welcomeMail").addEventListener("click",()=>openSetup());$("welcomePhone").addEventListener("click",()=>openSetup("twilio"));$("refresh").addEventListener("click",()=>busy($("refresh"),reload));$("poll").addEventListener("click",()=>busy($("poll"),async()=>{const r=await action("poll");notice(r.status==="paused"?tr("Connection is paused.","连接已暂停。"):(r.anchored?tr("Ready for new messages from now on.","已就绪，将收取此后到达的新消息。"):tr("New messages: ","新消息：")+(r.received||0))+(r.unreadable?tr(". Unreadable messages skipped: ","。已跳过无法读取的消息：")+r.unreadable:"")+(r.warning?" · "+r.warning:"")+(r.more?tr(". More messages remain; check again to continue.","。还有更多消息，可再次收取。"):""));await reload();}));
for(const [id,section] of [["inboxTab","events"],["outboxTab","results"]])$(id).addEventListener("click",()=>{tab=section;itemId="";generation++;loadItems();});
function openCompose(item=null,event=null){const row=current();if(!row)return;editingDraft=item;composeConnection=selected;composeEvent=event?event.id:"";composeId="reply-"+crypto.randomUUID();$("composeForm").reset();$("replyText").value=item?item.text||"":"";$("speak").checked=!!item&&(item.metadata||{}).speak;$("speak").disabled=!!item;text($("recipient"),tr("To: ","发送到：")+row.owner);$("speakLabel").hidden=row.kind!=="twilio";text($("composeHint"),event?tr("Review the saved task, then paste or write the reply for the address above. Saving resolves this message's reply reminder but does not send anything.","请查看已保存的任务，再为上方地址粘贴或撰写回复。保存后会解除这条消息的回复提醒，但不会发送。"):item?tr("Saving replaces the unsent draft. Your edited version waits for you to send it.","保存后会替换尚未发送的草稿。修改后的内容会等待你手动发送。"):row.kind==="twilio"?tr("SMS: up to 1,600 characters. Voice: up to 1,000 characters.","短信最多 1,600 字符，语音最多 1,000 字符。"):tr("Save first, then send from Replies & results.","保存后，在“回复与结果”中发送。"));notice("",false,"composeError");$("compose").showModal();$("replyText").focus();}
$("write").addEventListener("click",()=>openCompose());
$("composeForm").addEventListener("submit",event=>{event.preventDefault();busy($("saveReply"),async()=>{const payload={connection:composeConnection,text:$("replyText").value};if(editingDraft)await action("revise",{...payload,id:editingDraft.id,new_id:composeId,digest:editingDraft.digest});else await action("prepare",{...payload,id:composeId,event:composeEvent,speak:$("speak").checked});$("compose").close();editingDraft=null;composeEvent="";selected=composeConnection;tab="results";itemId=composeId;await loadItems();},"composeError");});
$("mailSetup").addEventListener("click",()=>{$("claimFields").hidden=!!data.mail_identity.verified;$("handle").value=data.mail_identity.handle||"";$("verifyEmail").value=data.mail_identity.email||"";text($("addressPreview"),"collie."+($("handle").value||"your-group")+"@collie.run");notice("",false,"identityStatus");$("identity").showModal();});
$("claim").addEventListener("click",()=>busy($("claim"),async()=>{await action("mail_claim",{handle:$("handle").value.trim(),email:$("verifyEmail").value.trim()});notice(tr("Code requested. Check your email.","验证码已请求，请检查邮箱。"),false,"identityStatus");},"identityStatus"));
$("verify").addEventListener("click",()=>busy($("verify"),async()=>{await action("mail_verify",{code:$("verifyCode").value.trim()});data=await api();$("claimFields").hidden=!!data.mail_identity.verified;notice(tr("Verified. You can create the address now.","验证成功，现在可以创建地址。"),false,"identityStatus");},"identityStatus"));
$("identityForm").addEventListener("submit",event=>{event.preventDefault();busy($("createMailbox"),async()=>{await action("mail_create",{name:$("dogName").value.trim()});data=await api();fillMailboxes();$("mailboxName").value=$("dogName").value.trim();$("identity").close();},"identityStatus");});
document.querySelectorAll("[data-close]").forEach(button=>button.addEventListener("click",()=>$(button.dataset.close).close()));
for(const id of ["setup","identity","compose"])$(id).addEventListener("keydown",event=>{if((event.key==="Enter"||event.key==="Escape")&&(event.isComposing||event.keyCode===229)){event.preventDefault();event.stopPropagation();}});
translate();fetch("/api/settings").then(r=>r.json()).then(r=>{const value=(r.values||{}).LANG;if(value&&value!=="auto"){lang=value.startsWith("zh")?"zh":"en";translate();renderConnections();renderItems();}}).catch(()=>{});reload().catch(e=>notice(e.message,true));setInterval(()=>{if(!document.hidden&&!document.querySelector("dialog[open]"))reload().catch(()=>{});},15000);
