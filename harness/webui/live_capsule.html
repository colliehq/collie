<main class="capsule" id="capsule">

  <div class="body">
    <div class="meta" id="target">COLLIE · LIVE CAPSULE</div>
    <div class="inputrow"><input id="command" autocomplete="off" placeholder="Say or type what Collie should do…" aria-label="Live command"></div>

<script>

/* The native shell turns the continuous Live recognizer off for each capsule recording it starts,

/* The stream dropped. The task keeps running on the server, so ask about THIS task by its session;
   never reopen the stream URL, which would start the same command a second time. */

/* A voice command is first classified by the model: a command runs, dictation is typed into the
