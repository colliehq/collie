name = "collie-relay"
main = "worker.js"
compatibility_date = "2026-01-01"
workers_dev = true

[[durable_objects.bindings]]
name = "RELAY"
class_name = "RelayRoom"

# Dog liveness is isolated from phone-remote rooms: one PresencePack Durable Object per pack.
# Provisioning requires a Worker secret (never put it in this file):
#   npx wrangler secret put PRESENCE_ADMIN_TOKEN
[[durable_objects.bindings]]
name = "PRESENCE"
class_name = "PresencePack"

# SQLite-backed Durable Objects work on the Workers free plan; RelayRoom and PresencePack both use
# storage for the small pieces of state that must survive hibernation/restart.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RelayRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["PresencePack"]
